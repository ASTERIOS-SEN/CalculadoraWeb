<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Calculadora online</title>
    <link rel="shortcut icon" href="https://cdn.icon-icons.com/icons2/272/PNG/512/Calculator_30001.png">
</head>
<body>
    <main class="calculator" aria-labelledby="calculator-title">
        <h1 id="calculator-title">Calculadora online</h1>
        <form class="calculator__form" name="CalculadoraOnline" aria-label="Formulario de calculadora">
            <label class="sr-only" for="Display">Pantalla de la calculadora</label>
            <input type="text" name="Display" id="Display" readonly aria-live="polite">
            <section class="calculator__keypad" aria-label="Teclado de la calculadora">
                <button type="button" data-value="7">7</button>
                <button type="button" data-value="8">8</button>
                <button type="button" data-value="9">9</button>
                <button type="button" data-value="/" class="operator" aria-label="Dividir">÷</button>

                <button type="button" data-value="4">4</button>
                <button type="button" data-value="5">5</button>
                <button type="button" data-value="6">6</button>
                <button type="button" data-value="*" class="operator" aria-label="Multiplicar">×</button>

                <button type="button" data-value="1">1</button>
                <button type="button" data-value="2">2</button>
                <button type="button" data-value="3">3</button>
                <button type="button" data-value="-" class="operator" aria-label="Restar">−</button>

                <button type="button" data-value="0">0</button>
                <button type="button" data-value=".">.</button>
                <button type="button" data-value="%" class="operator" aria-label="Porcentaje">%</button>
                <button type="button" data-value="+" class="operator" aria-label="Sumar">+</button>

                <button type="button" data-action="clear" class="control control--clear">Borrar</button>
                <button type="button" data-action="delete" class="control" aria-label="Eliminar último carácter">⌫</button>
                <button type="button" data-action="equals" class="control control--equals" aria-label="Obtener resultado">=</button>
            </section>
        </form>
    </main>

    <footer>
        <p>
            Proyecto Web con fines Educativos<br>
            Diseñado:<a href="mailto:dinnysevilla10@gmail.com"> Danny Sevilla</a><br>
            (c) Todos los derechos reservados - 2021
        </p>
    </footer>

    <script src="calc.js"></script>
</body>
</html>
